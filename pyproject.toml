[tool.poetry]
name = "order"
version = "0.1.0"
description = "Система заказов и оплат с SQLAlchemy, тестами и pre-commit хуками"
packages = [
    { include = "order_system" },
    { include = "user" },
    { include = "product" }
]

[tool.poetry.dependencies]
python = "^3.12"
sqlalchemy = "^2.0"



[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-mock = "^3.14"
black = "^24.8"
flake8 = "^7.1"
mypy = "^1.18.2"
isort = "^5.13"
pre-commit = "^3.8"
sqlalchemy2-stubs = "0.0.2a38"

[tool.black]
line-length = 79
target-version = ['py312']
skip-string-normalization = true

[tool.isort]
profile = "black"
line_length = 79
multi_line_output = 3
include_trailing_comma = true
combine_as_imports = true
force_grid_wrap = 0
known_first_party = ["order_system", "user", "product"]
skip = ["venv", ".venv", "build", "dist"]

[tool.flake8]
max-line-length = 79
exclude = ["venv", ".venv", "build", "dist", "__pycache__"]
extend-ignore = ["E203", "W503"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
disable_error_code = ["attr-defined", "misc", "call-arg", "assignment"]

[[tool.mypy.overrides]]
module = "sqlalchemy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disable_error_code = ["no-untyped-call"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["order_system", "user", "product"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
